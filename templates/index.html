<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
        

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon"></div>

        <div>
            <h1>EduGenie</h1>
            <p>AI Powered Learning Assistant</p>
        </div>

    </div>

    <button class="history-btn"
            onclick="loadHistory()">
        History
    </button>

</header>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- Welcome -->

    <section class="welcome">

        <h2>Welcome to EduGenie 
</h2>

        <p>
            Your personal AI learning assistant powered by
            Google Gemini.
        </p>

    </section>


    <!-- Feature Cards -->

    <section class="features">

        <button class="feature-card"
                onclick="selectFeature('chat')">

            <span></span>

            <h3>Ask Question</h3>

            <p>Ask EduGenie anything about your studies.</p>

        </button>


        <button class="feature-card"
                onclick="selectFeature('summary')">

            <span></span>

            <h3>Summarize</h3>

            <p>Convert lengthy study material into simple notes.</p>

        </button>


        <button class="feature-card"
                onclick="selectFeature('quiz')">

            <span></span>

            <h3>Generate Quiz</h3>

            <p>Create multiple-choice questions from any topic.</p>

        </button>


        <button class="feature-card"
                onclick="selectFeature('notes')">

            <span></span>

            <h3>Study Notes</h3>

            <p>Generate structured notes for revision.</p>

        </button>

    </section>


    <!-- ================= WORKSPACE ================= -->

    <section class="workspace">


        <!-- Feature Selection -->

        <div class="tabs">

            <button id="chatTab"
                    class="tab active"
                    onclick="selectFeature('chat')">

                 Ask Question

            </button>

            <button id="summaryTab"
                    class="tab"
                    onclick="selectFeature('summary')">

                 Summary

            </button>

            <button id="quizTab"
                    class="tab"
                    onclick="selectFeature('quiz')">

                Quiz

            </button>

            <button id="notesTab"
                    class="tab"
                    onclick="selectFeature('notes')">

                Notes

            </button>

        </div>


        <!-- Chat Form -->

        <div id="chatSection"
             class="section">

            <label>Ask your question</label>

            <textarea
                id="questionInput"
                placeholder="Example: Explain data structures in simple language..."
            ></textarea>

            <button class="primary-btn"
                    onclick="askQuestion()">

                Ask EduGenie 

            </button>

        </div>


        <!-- Summary Form -->

        <div id="summarySection"
             class="section hidden">

            <label>Paste your study material</label>

            <textarea
                id="summaryInput"
                placeholder="Paste your notes or study material here..."
            ></textarea>

            <button class="primary-btn"
                    onclick="generateSummary()">

                Generate Summary 

            </button>

        </div>


        <!-- Quiz Form -->

        <div id="quizSection"
             class="section hidden">

            <label>Enter quiz topic</label>

            <input
                id="quizInput"
                type="text"
                placeholder="Example: Python OOP"
            >

            <button class="primary-btn"
                    onclick="generateQuiz()">

                Generate Quiz 

            </button>

        </div>


        <!-- Notes Form -->

        <div id="notesSection"
             class="section hidden">

            <label>Enter topic</label>

            <input
                id="notesInput"
                type="text"
                placeholder="Example: Database Management System"
            >

            <button class="primary-btn"
                    onclick="generateNotes()">

                Generate Notes 

            </button>

        </div>


        <!-- Loading -->

        <div id="loading"
             class="loading hidden">

            <div class="spinner"></div>

            <p>EduGenie is thinking...</p>

        </div>


        <!-- Result -->

        <section id="resultSection"
                 class="result hidden">

            <div class="result-header">

                <h2> EduGenie Response</h2>

                <button onclick="copyResult()">
                    Copy
                </button>

            </div>

            <div id="resultText"
                 class="result-text">
            </div>

        </section>

    </section>


    <!-- ================= HISTORY ================= -->

    <section id="historySection"
             class="history hidden">

        <div class="history-header">

            <h2>Learning History</h2>

            <button onclick="deleteHistory()">
                Clear History
            </button>

        </div>

        <div id="historyList"></div>

    </section>


</main>


<footer>

    <p>
        EduGenie © 2026 | Powered by Google Gemini
    </p>

</footer>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
